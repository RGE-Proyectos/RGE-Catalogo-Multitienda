<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RGE-Catálogo Multinegocio</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase JS Client-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- jsPDF para generación de recibos en PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: {
          500: '#3b82f6',
          600: '#2563eb',
        }
      }
    }
  }
}
</script>
<style>
.btn-vender-main {
  width: 100%;
  background-color: #0d82df;
  color: #ffffff;
  font-size: 1.1rem;
  font-weight: bold;
  padding: 14px 20px;
  border: 2px solid #00bfff;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 15px;
  transition: background-color 0.2s ease, transform 0.1s ease;
}
.btn-vender-main:hover {
  background-color: #0b6ec2;
  transform: scale(1.01);
}
.search-box-modal {
  position: relative;
  margin: 12px 0;
}
.search-box-modal input {
  width: 100%;
  padding: 10px 10px 10px 35px;
  background-color: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  color: #ffffff;
}
.dropdown-results {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background-color: #0f172a;
  border: 1px solid #334155;
  border-radius: 0 0 8px 8px;
  max-height: 180px;
  overflow-y: auto;
  z-index: 100;
  list-style: none;
  padding: 0;
  margin: 0;
}
.dropdown-results li {
  padding: 10px 12px;
  border-bottom: 1px solid #1e293b;
  cursor: pointer;
  color: #e2e8f0;
}
.dropdown-results li:hover {
  background-color: #1e293b;
  color: #38bdf8;
}
.hidden-custom { display: none !important; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 transition-colors duration-200">
<!-- HEADER -->
<header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl shadow-lg">
        <i data-lucide="store" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
          RGE-Catálogo Multinegocio
        </h1>
        <p class="text-xs text-slate-400">Catálogo General y Subcategorías</p>
      </div>
    </div>
    <div class="relative flex-1 max-w-md hidden md:block">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input
        type="text"
        id="searchInput"
        onkeyup="filtrarProductos()"
        placeholder="Buscar por producto, SKU o categoría..."
        class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <button onclick="toggleMobileSearch()" class="md:hidden p-2 text-slate-400 hover:text-white">
      <i data-lucide="search" class="w-6 h-6"></i>
    </button>
  </div>
  <div id="mobileSearchContainer" class="hidden px-4 pb-3 md:hidden">
    <input
      type="text"
      id="mobileSearchInput"
      onkeyup="filtrarProductosMobile()"
      placeholder="Buscar producto o SKU..."
      class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>
</header>
<!-- CONTENIDO PRINCIPAL -->
<main class="max-w-7xl mx-auto px-4 mt-6">
  <div id="gridAreas" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-6"></div>
  <div id="subcategoriesContainer" class="mb-6 p-4 bg-slate-800/50 border border-slate-700/60 rounded-2xl hidden">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="filter" class="w-4 h-4 text-blue-400"></i>
        <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Subcategorías disponibles:</span>
      </div>
      <button onclick="seleccionarArea('Todas')" class="text-xs text-blue-400 hover:text-blue-300 underline">Ver Todo el Catálogo</button>
    </div>
    <div id="subcategoriesList" class="flex flex-wrap gap-2"></div>
  </div>
  <div class="flex items-center justify-between mb-4">
    <h2 id="areaTitle" class="text-lg font-bold text-slate-200">Todos los Productos</h2>
    <span id="productCounter" class="text-xs text-slate-400">Cargando productos...</span>
  </div>
  <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
</main>
<!-- MODAL DE FICHA TÉCNICA / VENTAS -->
<div id="productModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full max-h-[92vh] overflow-y-auto p-6 relative shadow-2xl">
    <button onclick="cerrarModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 z-10">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
    <div id="modalContent"></div>
  </div>
</div>
<!-- SCRIPT LÓGICO -->
<script>
const SUPABASE_URL = "https://zvtirryhqxxldceumfjs.supabase.co";
const SUPABASE_KEY = "sb_publishable_D6OqQEeNZWqXIE9I0qfz_A_9ilgTB4t";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CLAVE_ADMIN = "9514";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3rhMyBY3ZmIW2cR6OUl-mvHYVlSJ6Z3f0TeL8vIWW-Yr5w4-wSiDnsM1epqxyfq5kRw/exec";
let modoAdminActivado = false;
let todosLosProductos = [];
let areaActual = "Todas";
let subcategoriaActual = "Todas";
let productoSeleccionadoId = null;
let productoSeleccionadoModal = null;

// Estado del Carrito de Ventas en Modal
let carritoVenta = [];

const COLORES_DIVISIONES = {
  "Abarrotes Básicos": { bg: "rgba(217, 119, 6, 0.15)", border: "#d97706", text: "#f59e0b" },
  "Checkouts":         { bg: "rgba(168, 85, 247, 0.15)", border: "#a855f7", text: "#c084fc" },
  "Electricos":        { bg: "rgba(234, 179, 8, 0.15)", border: "#eab308", text: "#fde047" },
  "Herrajes":          { bg: "rgba(108, 117, 125, 0.2)", border: "#9ca3af", text: "#d1d5db" },
  "Herramienta":       { bg: "rgba(16, 185, 129, 0.15)", border: "#10b981", text: "#6ee7b7" },
  "Perfiles y Vidrios":{ bg: "rgba(0, 212, 255, 0.15)", border: "#00d4ff", text: "#38bdf8" },
  "Pinturas":          { bg: "rgba(236, 72, 153, 0.15)", border: "#ec4899", text: "#f472b6" },
  "Refacciones Moto":  { bg: "rgba(239, 68, 68, 0.15)", border: "#ef4444", text: "#f87171" },
  "DEFAULT":           { bg: "rgba(99, 102, 241, 0.15)", border: "#6366f1", text: "#818cf8" }
};

async function cargarCatalogo() {
  try {
    const { data: products, error } = await _supabase
      .from('products')
      .select(`
        id,
        sku,
        name,
        description,
        attributes,
        categories(name),
        product_prices(sale_price, cost_price),
        inventory_stocks(stock_qty)
      `);
    if (error) throw error;
    todosLosProductos = products.map(p => {
      let precio = 0, costo = 0, stock = 0;
      if (p.product_prices) {
        if (Array.isArray(p.product_prices) && p.product_prices.length > 0) {
          precio = parseFloat(p.product_prices[0].sale_price) || 0;
          costo = parseFloat(p.product_prices[0].cost_price) || 0;
        } else if (typeof p.product_prices === 'object') {
          precio = parseFloat(p.product_prices.sale_price) || 0;
          costo = parseFloat(p.product_prices.cost_price) || 0;
        }
      }
      if (p.inventory_stocks) {
        if (Array.isArray(p.inventory_stocks) && p.inventory_stocks.length > 0) {
          stock = parseInt(p.inventory_stocks[0].stock_qty) || 0;
        } else if (typeof p.inventory_stocks === 'object') {
          stock = parseInt(p.inventory_stocks.stock_qty) || 0;
        }
      }
      const categoriaNombre = p.categories?.name || p.attributes?.categoria || "General";
      const division = p.attributes?.Division || p.attributes?.division || p.division || "Herrajes";
      return { ...p, precio, costo, stock, categoriaNombre, area: division };
    });
    renderizarTarjetasDivisiones();
    renderizarProductos();
  } catch (e) {
    console.error("Error al cargar productos de Supabase:", e);
  }
}

function renderizarTarjetasDivisiones() {
  const grid = document.getElementById("gridAreas");
  if (!grid) return;
  const conteoDivisiones = {};
  todosLosProductos.forEach(p => {
    const div = p.area || "Herrajes";
    conteoDivisiones[div] = (conteoDivisiones[div] || 0) + 1;
  });
  const divisionesUnicas = Object.keys(conteoDivisiones).sort();
  grid.innerHTML = divisionesUnicas.map(div => {
    const count = conteoDivisiones[div];
    const isActive = areaActual === div;
    const estilo = COLORES_DIVISIONES[div] || COLORES_DIVISIONES["DEFAULT"];
    const estiloCard = isActive
      ? `background: ${estilo.bg}; border: 2px solid ${estilo.border}; box-shadow: 0 0 15px ${estilo.border}40;`
      : `background: rgba(30, 41, 59, 0.7); border: 1.5px solid ${estilo.border}80;`;
    return `
      <div onclick="seleccionarArea('${div}')" style="${estiloCard}" class="cursor-pointer p-4 rounded-2xl hover:scale-[1.02] transition-all duration-200">
        <div class="flex justify-between items-start mb-2">
          <i data-lucide="layers" class="w-6 h-6" style="color: ${estilo.text};"></i>
          <span class="text-xs font-extrabold px-3 py-0.5 rounded-full" style="background: ${estilo.bg}; color: ${estilo.text}; border: 1px solid ${estilo.border};">${count} arts</span>
        </div>
        <h3 class="font-bold text-slate-100 text-base line-clamp-1">${div}</h3>
      </div>
    `;
  }).join('');
  lucide.createIcons();
}

function seleccionarArea(area) {
  areaActual = area;
  subcategoriaActual = "Todas";
  document.getElementById("areaTitle").innerText = area === "Todas" ? "Todos los Productos" : area;
  renderizarTarjetasDivisiones();
  renderizarProductos();
}

function seleccionarSubcategoria(subcat) {
  subcategoriaActual = subcat;
  renderizarProductos();
}

function generarSubcategorias(productosBase) {
  const container = document.getElementById("subcategoriesList");
  const wrapper = document.getElementById("subcategoriesContainer");
  if (!productosBase || productosBase.length === 0) {
    if (wrapper) wrapper.classList.add("hidden");
    return;
  }
  const categoriasUnicas = [...new Set(productosBase.map(p => p.categoriaNombre))].filter(Boolean).sort();
  if (categoriasUnicas.length === 0) {
    if (wrapper) wrapper.classList.add("hidden");
    return;
  }
  if (wrapper) wrapper.classList.remove("hidden");
  let html = `<button onclick="seleccionarSubcategoria('Todas')" class="px-3 py-1 rounded-lg text-xs font-semibold transition ${subcategoriaActual === 'Todas' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">Todas (${productosBase.length})</button>`;
  categoriasUnicas.forEach(cat => {
    const count = productosBase.filter(p => p.categoriaNombre === cat).length;
    const isActive = subcategoriaActual === cat;
    html += `<button onclick="seleccionarSubcategoria('${cat}')" class="px-3 py-1 rounded-lg text-xs font-semibold transition ${isActive ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">${cat} (${count})</button>`;
  });
  container.innerHTML = html;
}

function renderizarProductos() {
  const grid = document.getElementById("productsGrid");
  const inputDesk = document.getElementById("searchInput")?.value || "";
  const inputMob = document.getElementById("mobileSearchInput")?.value || "";
  const busqueda = (inputDesk || inputMob).toLowerCase().trim();
  let filtrados = [];
  if (busqueda !== "") {
    const coincidencias = todosLosProductos.filter(p => 
      p.name.toLowerCase().includes(busqueda) ||
      p.sku.toLowerCase().includes(busqueda) ||
      p.categoriaNombre.toLowerCase().includes(busqueda) ||
      p.area.toLowerCase().includes(busqueda)
    );
    document.getElementById("areaTitle").innerText = `Resultados para "${busqueda}"`;
    generarSubcategorias(coincidencias);
    filtrados = subcategoriaActual !== "Todas" ? coincidencias.filter(p => p.categoriaNombre === subcategoriaActual) : coincidencias;
  } else {
    document.getElementById("areaTitle").innerText = areaActual === "Todas" ? "Todos los Productos" : areaActual;
    let delArea = areaActual === "Todas" ? todosLosProductos : todosLosProductos.filter(p => p.area === areaActual);
    if (areaActual !== "Todas") generarSubcategorias(delArea);
    else document.getElementById("subcategoriesContainer")?.classList.add("hidden");
    filtrados = delArea.filter(p => subcategoriaActual === "Todas" || p.categoriaNombre === subcategoriaActual);
  }
  
  document.getElementById("productCounter").innerText = `${filtrados.length} productos`;
  if (filtrados.length === 0) {
    grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3 text-slate-600"></i><p class="text-base font-semibold">No se encontraron productos.</p></div>`;
    lucide.createIcons();
    return;
  }
  
  grid.innerHTML = filtrados.map(p => {
    const esPrecioCero = p.precio <= 0;
    const estiloDiv = COLORES_DIVISIONES[p.area] || COLORES_DIVISIONES["DEFAULT"];
    const htmlPrecio = esPrecioCero ? `<span class="text-sm font-bold text-amber-400">Por definir</span>` : `<p class="text-lg font-bold text-emerald-400">$${p.precio.toFixed(2)}</p>`;
    const badgeStockHtml = p.stock <= 0 
      ? `<span class="text-xs px-2 py-1 rounded-full bg-red-500/10 text-red-500 border border-red-500/30 font-bold">Agotado</span>`
      : `<span class="text-xs px-2 py-1 rounded-full ${p.stock > 3 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">Stock: ${p.stock}</span>`;

    return `
      <div onclick="verFichaTecnica('${p.id}')" class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-500 transition cursor-pointer shadow-md">
        <div>
          <div class="h-48 bg-slate-900 rounded-xl mb-3 overflow-hidden flex items-center justify-center p-2">
            <img src="${p.attributes?.imagen_url || 'https://via.placeholder.com/200'}" class="max-h-full max-w-full object-contain" alt="${p.name}" />
          </div>
          <div class="flex items-center justify-between gap-1 mb-1">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border" style="background: ${estiloDiv.bg}; color: ${estiloDiv.text}; border-color: ${estiloDiv.border};">${p.area}</span>
            <span class="text-[11px] text-slate-400 font-mono">${p.sku}</span>
          </div>
          <h3 class="font-bold text-slate-100 text-sm mt-2 line-clamp-2">${p.name}</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700/50 flex items-center justify-between">
          <div><p class="text-[10px] text-slate-400 uppercase tracking-wider">Precio</p>${htmlPrecio}</div>
          <div>${badgeStockHtml}</div>
        </div>
      </div>
    `;
  }).join('');
  lucide.createIcons();
}

function verFichaTecnica(id) {
  productoSeleccionadoId = id;
  const p = todosLosProductos.find(item => item.id === id);
  if (!p) return;
  productoSeleccionadoModal = p;
  const esPrecioCero = p.precio <= 0;
  const margen = p.precio > 0 ? (((p.precio - p.costo) / p.precio) * 100).toFixed(1) : 0;

  let htmlAdminSection = modoAdminActivado ? `
    <div class="bg-slate-800 p-3 rounded-xl border border-amber-500/40 mb-4 text-xs space-y-1">
      <div class="flex items-center justify-between font-bold text-amber-400 mb-2">
        <span>Información de Propietario</span>
        <a href="#" onclick="desactivarModoAdmin(event)" class="text-[10px] text-slate-400 hover:text-white underline">Cerrar sesión</a>
      </div>
      <div class="flex justify-between text-slate-300"><span>Costo Directo:</span><strong class="font-mono">$${p.costo.toFixed(2)}</strong></div>
      <div class="flex justify-between text-slate-300"><span>Margen Bruto:</span><strong class="font-mono text-amber-300">${margen}%</strong></div>
    </div>
  ` : `
    <div class="mb-4 text-center">
      <button onclick="solicitarClaveAdmin()" class="text-xs text-slate-500 hover:text-slate-300 flex items-center justify-center gap-1 mx-auto py-1 px-3 bg-slate-800/60 rounded-lg border border-slate-700/50 transition">
        <i data-lucide="lock" class="w-3 h-3"></i> Acceso Propietario
      </button>
    </div>
  `;

  document.getElementById("modalContent").innerHTML = `
    <div class="text-center mb-4">
      <img src="${p.attributes?.imagen_url || 'https://via.placeholder.com/200'}" class="h-44 mx-auto object-contain rounded-lg mb-2" />
      <span class="text-xs font-semibold text-blue-400 bg-blue-500/10 px-2 py-1 rounded-md">${p.categoriaNombre}</span>
      <h2 class="text-lg font-bold text-slate-100 mt-2">${p.name}</h2>
      <p class="text-xs text-slate-400 font-mono">SKU: ${p.sku || 'N/A'}</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4 bg-slate-800/50 p-3 rounded-xl border border-slate-700 text-center">
      <div><p class="text-xs text-slate-400">PRECIO VENTA</p><p class="text-xl font-bold text-emerald-400">$${p.precio.toFixed(2)}</p></div>
      <div><p class="text-xs text-slate-400">EXISTENCIAS</p><p class="text-xl font-bold text-slate-200">${p.stock} u.</p></div>
    </div>
    ${htmlAdminSection}
    <button onclick="abrirModuloVentasDesdeFicha()" class="btn-vender-main flex items-center justify-center gap-2">
      <i data-lucide="shopping-cart" class="w-5 h-5"></i> VENDER Productos
    </button>
  `;
  document.getElementById("productModal").classList.remove("hidden");
  lucide.createIcons();
}

function abrirModuloVentasDesdeFicha() {
  if (!productoSeleccionadoModal) return;
  carritoVenta = [];
  if (productoSeleccionadoModal.stock > 0 && productoSeleccionadoModal.precio > 0) {
    carritoVenta.push({
      ...productoSeleccionadoModal,
      cantidadVenta: 1
    });
  }
  renderizarPantallaVentasModal();
}

function renderizarPantallaVentasModal() {
  const totalGeneral = carritoVenta.reduce((acc, item) => acc + (item.precio * item.cantidadVenta), 0);

  let filasCarrito = carritoVenta.length === 0 
    ? `<tr><td colspan="4" class="text-center py-6 text-slate-500 text-xs">No hay productos en el carrito. Usa el buscador superior para agregar artículos.</td></tr>`
    : carritoVenta.map((item, index) => `
        <tr class="border-b border-slate-800 hover:bg-slate-800/40 text-xs">
          <td class="py-2.5 px-2 text-slate-200 font-medium">${index + 1}.- ${item.name}</td>
          <td class="py-2.5 px-2 text-center">
            <input type="number" min="1" max="${item.stock}" value="${item.cantidadVenta}" onchange="actualizarCantidadItem(${index}, this.value)" class="w-14 bg-slate-800 border border-slate-700 text-center text-emerald-400 font-bold rounded py-1" />
          </td>
          <td class="py-2.5 px-2 text-right font-mono text-cyan-400">$${(item.precio * item.cantidadVenta).toFixed(1)}</td>
          <td class="py-2.5 px-2 text-center">
            <button onclick="removerItemCarrito(${index})" class="text-red-400 hover:text-red-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </td>
        </tr>
      `).join('');

  document.getElementById("modalContent").innerHTML = `
    <div class="space-y-4">
      <div class="text-center pb-2 border-b border-slate-800">
        <h2 class="text-lg font-bold text-cyan-400 tracking-wide uppercase">Módulo de Salidas y Ventas</h2>
        <p class="text-xs text-slate-400">Busca artículos y registra cantidades para facturar</p>
      </div>

      <!-- Buscador dentro de Ventas -->
      <div class="search-box-modal">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="inputBuscadorVentas" placeholder="Buscar por producto, SKU o categoría..." oninput="filtrarDropdownVentas(this.value)" autocomplete="off">
        <ul id="listaResultadosVentas" class="dropdown-results hidden-custom"></ul>
      </div>

      <!-- Tabla del Carrito -->
      <div class="max-h-56 overflow-y-auto border border-slate-800 rounded-xl bg-slate-950/60 p-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-[11px] text-cyan-400 border-b border-slate-800 uppercase">
              <th class="py-2 px-2">Descripción</th>
              <th class="py-2 px-2 text-center">Cant.</th>
              <th class="py-2 px-2 text-right">Subtotal</th>
              <th class="py-2 px-2 text-center"></th>
            </tr>
          </thead>
          <tbody>
            ${filasCarrito}
          </tbody>
        </table>
      </div>

      <!-- Totales y Cobro -->
      <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 text-sm font-bold">
        <div class="flex justify-between text-slate-300 text-base"><span>TOTAL:</span><span id="lblTotalVenta" class="text-emerald-400 font-mono text-lg">$${totalGeneral.toFixed(1)}</span></div>
        <div class="flex justify-between items-center text-slate-300">
          <span>Pago con:</span>
          <input type="number" id="inputPagoCliente" oninput="calcularCambioVenta(${totalGeneral})" placeholder="0.00" class="w-32 bg-slate-900 border border-slate-700 text-right px-2 py-1 rounded text-emerald-400 font-mono" />
        </div>
        <div class="flex justify-between text-slate-300"><span>Cambio:</span><span id="lblCambioVenta" class="text-amber-400 font-mono">$0.00</span></div>
      </div>

      <!-- Notas -->
      <div>
        <label class="text-[11px] text-slate-400 uppercase tracking-wider block mb-1">Notas del Ticket / Cliente:</label>
        <input type="text" id="inputNotasVenta" placeholder="Ej. Cliente frecuente o referencia..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200" />
      </div>

      <!-- Botón Confirmar Venta -->
      <button onclick="procesarVentaCompleta()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-lg text-base">
        <i data-lucide="check-circle" class="w-5 h-5"></i> Completar Venta y Generar Recibo PDF
      </button>
    </div>
  `;
  lucide.createIcons();
}

function filtrarDropdownVentas(texto) {
  const listaUI = document.getElementById('listaResultadosVentas');
  if (!listaUI) return;
  listaUI.innerHTML = '';
  if (!texto || texto.trim() === '') {
    listaUI.classList.add('hidden-custom');
    return;
  }
  const query = texto.toLowerCase();
  const coincidencias = todosLosProductos.filter(p => 
    p.name.toLowerCase().includes(query) || 
    (p.sku && p.sku.toLowerCase().includes(query))
  );
  if (coincidencias.length === 0) {
    listaUI.classList.add('hidden-custom');
    return;
  }
  coincidencias.forEach(prod => {
    const li = document.createElement('li');
    li.textContent = `${prod.name} (SKU: ${prod.sku || 'N/A'}) - Stock: ${prod.stock}`;
    li.onclick = () => agregarAlCarritoVentas(prod);
    listaUI.appendChild(li);
  });
  listaUI.classList.remove('hidden-custom');
}

function agregarAlCarritoVentas(prod) {
  if (prod.stock <= 0) {
    alert("Este producto no tiene existencias disponibles.");
    return;
  }
  if (prod.precio <= 0) {
    alert("Este producto no cuenta con un precio de venta asignado.");
    return;
  }
  const existente = carritoVenta.find(item => item.id === prod.id);
  if (existente) {
    if (existente.cantidadVenta < prod.stock) {
      existente.cantidadVenta++;
    } else {
      alert("No puedes agregar más unidades que el stock disponible.");
    }
  } else {
    carritoVenta.push({ ...prod, cantidadVenta: 1 });
  }
  document.getElementById('listaResultadosVentas').classList.add('hidden-custom');
  document.getElementById('inputBuscadorVentas').value = '';
  renderizarPantallaVentasModal();
}

function actualizarCantidadItem(index, nuevaCant) {
  const cant = parseInt(nuevaCant);
  const item = carritoVenta[index];
  if (isNaN(cant) || cant <= 0) {
    item.cantidadVenta = 1;
  } else if (cant > item.stock) {
    alert(`Stock insuficiente. Máximo disponible: ${item.stock}`);
    item.cantidadVenta = item.stock;
  } else {
    item.cantidadVenta = cant;
  }
  renderizarPantallaVentasModal();
}

function removerItemCarrito(index) {
  carritoVenta.splice(index, 1);
  renderizarPantallaVentasModal();
}

function calcularCambioVenta(total) {
  const pagoInput = parseFloat(document.getElementById('inputPagoCliente')?.value) || 0;
  const cambio = pagoInput - total;
  const lbl = document.getElementById('lblCambioVenta');
  if (lbl) {
    lbl.textContent = cambio >= 0 ? `$${cambio.toFixed(2)}` : "Pago insuficiente";
  }
}

async function procesarVentaCompleta() {
  if (carritoVenta.length === 0) {
    alert("El carrito de venta está vacío.");
    return;
  }
  const totalVenta = carritoVenta.reduce((acc, item) => acc + (item.precio * item.cantidadVenta), 0);
  const pagoCliente = parseFloat(document.getElementById('inputPagoCliente')?.value) || 0;
  if (pagoCliente < totalVenta) {
    alert("El monto de pago es menor al total de la venta.");
    return;
  }
  const notas = document.getElementById('inputNotasVenta')?.value || "";

  // Generación de Folio Consecutivo Diario (ej. R-2108-001)
  const ahora = new Date();
  const dia = String(ahora.getDate()).padStart(2, '0');
  const mes = String(ahora.getMonth() + 1).padStart(2, '0');
  const claveDiaMes = `${dia}${mes}`;
  
  let claveContadorKey = `consecutivo_recibo_${claveDiaMes}`;
  let consecutivoActual = parseInt(localStorage.getItem(claveContadorKey) || "0") + 1;
  localStorage.setItem(claveContadorKey, consecutivoActual);
  const folioRecibo = `R-${claveDiaMes}-${String(consecutivoActual).padStart(3, '0')}`;

  const fechaFormateada = `${dia}/${mes}/${ahora.getFullYear()}`;

  try {
    // Actualizar Supabase y enviar a Google Sheets de forma masiva
    for (const item of carritoVenta) {
      const nuevoStock = item.stock - item.cantidadVenta;
      const { error } = await _supabase
        .from('inventory_stocks')
        .update({ stock_qty: nuevoStock })
        .eq('product_id', item.id);
      if (error) throw error;
      item.stock = nuevoStock; // actualizar localmente

      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.trim() !== "") {
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fecha: fechaFormateada,
            producto: item.name,
            cantidad: item.cantidadVenta,
            movimiento: `Venta (${folioRecibo})`,
            notas: notas,
            sku: item.sku || "N/A",
            total: item.precio * item.cantidadVenta
          })
        }).catch(e => console.warn("Google Sheets sync warning:", e));
      }
    }

    // Generar PDF con jsPDF
    generarPDFRecibo(folioRecibo, fechaFormateada, totalVenta, pagoCliente, pagoCliente - totalVenta, notas);

    alert(`¡Venta registrada con éxito!\nFolio generado: ${folioRecibo}`);
    cerrarModal();
    renderizarProductos();
  } catch (err) {
    console.error("Error al procesar la venta:", err);
    alert("Ocurrió un error al procesar la transacción en la base de datos.");
  }
}

function generarPDFRecibo(folio, fecha, total, pago, cambio, notas) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: [80, 150] }); // Formato ticket térmico 80mm

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.text("RGE MULTINEGOCIO", 40, 8, { align: "center" });
  
  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");
  doc.text(`Folio: ${folio}`, 5, 15);
  doc.text(`Fecha: ${fecha}`, 5, 20);
  if (notas) doc.text(`Nota: ${notas}`, 5, 25);

  doc.line(5, 28, 75, 28);
  
  let y = 33;
  doc.setFont("helvetica", "bold");
  doc.text("CANT  DESCRIPCION", 5, y);
  doc.text("SUBTOTAL", 75, y, { align: "right" });
  y += 5;

  doc.setFont("helvetica", "normal");
  carritoVenta.forEach(item => {
    doc.text(`${item.cantidadVenta}x ${item.name.substring(0, 22)}`, 5, y);
    doc.text(`$${(item.precio * item.cantidadVenta).toFixed(1)}`, 75, y, { align: "right" });
    y += 6;
  });

  doc.line(5, y, 75, y);
  y += 5;

  doc.setFont("helvetica", "bold");
  doc.text(`TOTAL: $${total.toFixed(2)}`, 75, y, { align: "right" });
  y += 5;
  doc.text(`PAGO: $${pago.toFixed(2)}`, 75, y, { align: "right" });
  y += 5;
  doc.text(`CAMBIO: $${cambio.toFixed(2)}`, 75, y, { align: "right" });
  
  y += 10;
  doc.setFontSize(8);
  doc.setFont("helvetica", "italic");
  doc.text("¡Gracias por su compra!", 40, y, { align: "center" });

  // Descargar PDF con el nombre del folio exacto
  doc.save(`${folio}.pdf`);
}
